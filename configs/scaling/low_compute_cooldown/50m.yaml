app: robo_jepa
cpus_per_task: 16
data:
  s3_prefix: s3://<bucket>/data/robotics/
  s3_profile: <aws_profile>
  train:
    1X:
      cameras:
      - front
      embodiment_name: 1x_robot
      fps: 3
      gripper_dim: 0
      joints_dim: 0
      pose_dim: 25
      raw_fps: 30
      s3_prefix: 1x-data
      view_map:
        front: 3
    AGIBot_humanoid:
      cameras:
      - .*
      - .*
      embodiment_name: agibot_humanoid
      fps: 1
      gripper_dim: 12
      joints_dim: 0
      pose_dim: 23
      raw_fps: 30
      s3_prefix: agibot/humanoid
      view_map:
        hand_left_color: 2
        hand_right_color: 2
        head_color: 3
    AGIBot_robotiq:
      cameras:
      - .*
      - .*
      embodiment_name: agibot_robotic
      fps: 1
      gripper_dim: 2
      joints_dim: 0
      pose_dim: 23
      raw_fps: 30
      s3_prefix: agibot/robotiq
      view_map:
        hand_left_color: 2
        hand_right_color: 2
        head_color: 3
    Droid:
      cameras:
      - .*
      - .*
      embodiment_name: franka
      filter_samples_func: app.robo_jepa.datasets.droid.filter_positive_negative_droid
      filter_samples_func_kwargs:
        negative_filter:
          buildings:
          - setup room
          labs:
          - REAL
      fps: 5
      gripper_dim: 1
      intermediate_frames_fps: 30
      joints_dim: 7
      pose_dim: 6
      raw_fps: 60
      s3_prefix: droid/1.0.1/
      use_joint_state: false
      view_map:
        left: 0
        right: 1
        wrist: 2
    Droid_cart_action_key:
      action_key_layout: droid_cart
      action_source: action_key
      cameras:
      - .*
      - .*
      embodiment_name: franka_cart_action_key
      filter_samples_func: app.robo_jepa.datasets.droid.filter_positive_negative_droid
      filter_samples_func_kwargs:
        negative_filter:
          buildings:
          - setup room
          labs:
          - REAL
      fps: 7.5
      gripper_dim: 1
      intermediate_frames_fps: 30
      joints_dim: 7
      pose_dim: 6
      raw_fps: 60
      s3_prefix: droid/1.0.1/
      view_map:
        left: 0
        right: 1
        wrist: 2
    Droid_cart_vel_action_key:
      action_key_layout: droid_cart_vel
      action_source: action_key
      cameras:
      - .*
      - .*
      embodiment_name: franka_cart_vel_action_key
      filter_samples_func: app.robo_jepa.datasets.droid.filter_positive_negative_droid
      filter_samples_func_kwargs:
        negative_filter:
          buildings:
          - setup room
          labs:
          - REAL
      fps: 7.5
      gripper_dim: 1
      intermediate_frames_fps: 30
      joints_dim: 7
      pose_dim: 6
      raw_fps: 60
      s3_prefix: droid/1.0.1/
      view_map:
        left: 0
        right: 1
        wrist: 2
    Droid_joint_action_key:
      action_key_layout: droid_joint
      action_source: action_key
      cameras:
      - .*
      - .*
      embodiment_name: franka_joint_action_key
      filter_samples_func: app.robo_jepa.datasets.droid.filter_positive_negative_droid
      filter_samples_func_kwargs:
        negative_filter:
          buildings:
          - setup room
          labs:
          - REAL
      fps: 7.5
      gripper_dim: 1
      intermediate_frames_fps: 30
      joints_dim: 7
      pose_dim: 6
      raw_fps: 60
      s3_prefix: droid/1.0.1/
      view_map:
        left: 0
        right: 1
        wrist: 2
    Droid_joint_vel_action_key:
      action_key_layout: droid_joint_vel
      action_source: action_key
      cameras:
      - .*
      - .*
      embodiment_name: franka_joint_vel_action_key
      filter_samples_func: app.robo_jepa.datasets.droid.filter_positive_negative_droid
      filter_samples_func_kwargs:
        negative_filter:
          buildings:
          - setup room
          labs:
          - REAL
      fps: 7.5
      gripper_dim: 1
      intermediate_frames_fps: 30
      joints_dim: 7
      pose_dim: 6
      raw_fps: 60
      s3_prefix: droid/1.0.1/
      view_map:
        left: 0
        right: 1
        wrist: 2
    Droid_joints:
      cameras:
      - .*
      - .*
      embodiment_name: franka_joints
      filter_samples_func: app.robo_jepa.datasets.droid.filter_positive_negative_droid
      filter_samples_func_kwargs:
        negative_filter:
          buildings:
          - setup room
          labs:
          - REAL
      fps: 5
      gripper_dim: 1
      intermediate_frames_fps: 30
      joints_dim: 7
      pose_dim: 6
      raw_fps: 60
      s3_prefix: droid/1.0.1/
      use_joint_state: true
      view_map:
        left: 0
        right: 1
        wrist: 2
    Lerobot:
      cameras:
      - .*
      - .*
      embodiment_name: so-101
      fps: 5
      gripper_dim: 1
      intermediate_frames_fps: 30
      joints_dim: 5
      pose_dim: 6
      raw_fps: 30
      s3_prefix: lerobot/single_arm_labeled
      view_map:
        front: 6
        front_1: 6
        front_2: 6
        left: 0
        right: 1
        right_1: 1
        right_2: 1
        top: 5
        top_1: 5
        top_2: 5
        top_3: 5
        wrist: 2
    Lerobot_joints:
      cameras:
      - .*
      - .*
      embodiment_name: so-101_joints
      fps: 5
      gripper_dim: 1
      intermediate_frames_fps: 30
      joints_dim: 5
      pose_dim: 6
      raw_fps: 30
      s3_prefix: lerobot/single_arm_labeled
      use_joint_state: true
      view_map:
        front: 6
        front_1: 6
        front_2: 6
        left: 0
        right: 1
        right_1: 1
        right_2: 1
        top: 5
        top_1: 5
        top_2: 5
        top_3: 5
        wrist: 2
    OXE_Bridge:
      cameras:
      - right
      embodiment_name: bridge
      fps: 5
      gripper_dim: 1
      joints_dim: 7
      pose_dim: 6
      raw_fps: 5
      s3_prefix: oxe/bridge
      view_map:
        right: 1
    OXE_Bridge2:
      cameras:
      - .*
      - .*
      embodiment_name: bridge
      fps: 5
      gripper_dim: 1
      joints_dim: 7
      pose_dim: 6
      raw_fps: 5
      s3_prefix: oxe/bridge2
      view_map:
        camera1: 4
        camera2: 4
        right_back: 1
    OXE_RT1:
      cameras:
      - back
      embodiment_name: google
      fps: 5
      gripper_dim: 1
      joints_dim: 7
      pose_dim: 6
      raw_fps: 10
      s3_prefix: rt1
      view_map:
        back: 3
    OXE_bcz:
      cameras:
      - back
      embodiment_name: google
      fps: 5
      gripper_dim: 1
      joints_dim: 7
      pose_dim: 6
      raw_fps: 10
      s3_prefix: oxe/bc_z/
      view_map:
        back: 3
    OXE_fmb:
      cameras:
      - left|right
      embodiment_name: franka_fmb
      fps: 5
      gripper_dim: 1
      joints_dim: 7
      pose_dim: 6
      raw_fps: 10
      s3_prefix: oxe/fmb/
      view_map:
        left: 0
        right: 1
    OXE_language_table_real:
      cameras:
      - front
      embodiment_name: language_table
      fps: 5
      gripper_dim: 0
      joints_dim: 7
      pose_dim: 2
      raw_fps: 5
      s3_prefix: oxe/language_table/
      view_map:
        front: 6
    OXE_language_table_sim:
      cameras:
      - front
      embodiment_name: language_table
      fps: 5
      gripper_dim: 0
      joints_dim: 7
      pose_dim: 2
      raw_fps: 5
      s3_prefix: oxe/language_table_sim/
      view_map:
        front: 6
    OXE_mtopt:
      cameras:
      - left
      embodiment_name: kuka
      fps: 5
      gripper_dim: 1
      joints_dim: 7
      pose_dim: 6
      raw_fps: 5
      s3_prefix: oxe/mtopt
      view_map:
        left: 0
    OXE_qtopt:
      cameras:
      - left
      embodiment_name: kuka
      fps: 10
      gripper_dim: 1
      joints_dim: 7
      pose_dim: 6
      raw_fps: 10
      s3_prefix: qtopt
      view_map:
        left: 0
    OXE_robonet_baxter:
      cameras:
      - .*
      embodiment_name: baxter
      fps: 1
      gripper_dim: 1
      joints_dim: 7
      pose_dim: 6
      raw_fps: 1
      s3_prefix: oxe/robonet/baxter
      view_map:
        .*: 4
    OXE_robonet_franka:
      cameras:
      - .*
      embodiment_name: franka_robonet
      fps: 1
      gripper_dim: 1
      joints_dim: 7
      pose_dim: 6
      raw_fps: 1
      s3_prefix: oxe/robonet/franka
      view_map:
        .*: 4
    OXE_robonet_kuka:
      cameras:
      - .*
      embodiment_name: kuka_robonet
      fps: 1
      gripper_dim: 1
      joints_dim: 7
      pose_dim: 6
      raw_fps: 1
      s3_prefix: oxe/robonet/kuka
      view_map:
        .*: 4
    OXE_robonet_sawyer:
      cameras:
      - .*
      embodiment_name: sawyer
      fps: 1
      gripper_dim: 1
      joints_dim: 7
      pose_dim: 6
      raw_fps: 1
      s3_prefix: oxe/robonet/sawyer
      view_map:
        .*: 4
    OXE_robonet_widowx:
      cameras:
      - .*
      embodiment_name: widowx_robonet
      fps: 1
      gripper_dim: 1
      joints_dim: 7
      pose_dim: 6
      raw_fps: 1
      s3_prefix: oxe/robonet/sawyer
      view_map:
        .*: 4
    RoboCasa:
      action_source: action_key
      cameras:
      - .*
      - .*
      embodiment_name: franka_omron
      fps: 5
      gripper_dim: 1
      intermediate_frames_fps: 20
      joints_dim: 7
      pose_dim: 13
      raw_fps: 20
      s3_prefix: robocasa/human_720p/
      view_map:
        robot0_agentview_left: 0
        robot0_agentview_right: 1
        robot0_eye_in_hand: 2
    RoboCasa_state_delta:
      cameras:
      - .*
      - .*
      embodiment_name: franka_omron_state_delta
      fps: 5
      gripper_dim: 1
      intermediate_frames_fps: 20
      joints_dim: 7
      pose_dim: 13
      raw_fps: 20
      s3_prefix: robocasa/human_720p/
      view_map:
        robot0_agentview_left: 0
        robot0_agentview_right: 1
        robot0_eye_in_hand: 2
    Robomind_franka:
      cameras:
      - .*
      - .*
      embodiment_name: robomind_franka
      fps: 5
      gripper_dim: 1
      joints_dim: 7
      pose_dim: 6
      raw_fps: 30
      s3_prefix: robomind/robomind_franka
      view_map:
        camera_left: 0
        camera_right: 1
        camera_top: 5
    Roboset:
      cameras:
      - .*
      - .*
      embodiment_name: franka_roboset
      fps: 1
      gripper_dim: 1
      intermediate_frames_fps: 5
      joints_dim: 7
      pose_dim: 6
      raw_fps: 5
      s3_prefix: roboset/
      view_map:
        left: 0
        right: 1
        top: 5
        wrist: 2
    kwargs:
      augmentations:
        auto_augment: false
        crop_height: 240
        crop_width: 320
        motion_shift: false
        random_horizontal_flip: false
        random_resize_aspect_ratio:
        - 1.333
        - 1.777
        random_resize_scale:
        - 0.5
        - 1.0
        reprob: 0.0
      batch_size: 16
      frames_per_clip: 16
      min_length_to_drop: 4
      num_workers: 10
      pad_size: 64
      read_intermediate_frames: false
    robomind_agilex:
      cameras:
      - .*
      - .*
      embodiment_name: agilex
      fps: 5
      gripper_dim: 2
      joints_dim: 12
      pose_dim: 12
      raw_fps: 30
      s3_prefix: robomind/robomind_agilex
      view_map:
        camera_front: 3
        camera_left_wrist: 2
        camera_right_wrist: 2
    view_groups:
      one_view:
        dataset_overrides:
          AGIBot_humanoid:
            cameras:
            - head_color
          AGIBot_robotiq:
            cameras:
            - head_color
          Droid:
            cameras:
            - left|right
          Droid_cart_action_key:
            cameras:
            - left|right
          Droid_cart_vel_action_key:
            cameras:
            - left|right
          Droid_joint_action_key:
            cameras:
            - left|right
          Droid_joint_vel_action_key:
            cameras:
            - left|right
          Droid_joints:
            cameras:
            - left|right
          Lerobot:
            cameras:
            - .*
          Lerobot_joints:
            cameras:
            - .*
          OXE_Bridge2:
            cameras:
            - .*
          RoboCasa:
            cameras:
            - robot0_agentview_left|robot0_agentview_right
          RoboCasa_state_delta:
            cameras:
            - robot0_agentview_left|robot0_agentview_right
          Robomind_franka:
            cameras:
            - .*
          Roboset:
            cameras:
            - left|right|top
          robomind_agilex:
            cameras:
            - camera_front
        datasets:
        - Droid
        - Droid_joints
