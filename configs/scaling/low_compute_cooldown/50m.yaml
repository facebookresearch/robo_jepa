folder: /path/to/robo_jepa/low_compute_cooldown/50m/
logging:
  write_tag: world_model
loss:
  cos_loss_weight: 1.0
  loss_exp: 2.0
  no_loss_mask_tokens: false
  power_loss_weight: 0.01
  reg_coeff:
  - 0.0
meta:
  compile: true
  dtype: bfloat16
  eval_freq: 150
  fsdp:
    cpu_offload: false
    enabled: false
    mesh_layout: hsdp
  load_checkpoint: true
  load_checkpoint_strict: false
  pretrained: jepa-pretrained.pth.tar
  read_checkpoint: <INPUT_CHECKPOINT_PATH>
  save_every_freq: 10
  seed: 234
  use_sdpa: true
  cooldown:
    enabled: true
    num_steps: 5000
model:
  encoder_pretrained_path: /path/to/vjepa2_1_vitG_384.pt
  encoder_version: v21
  heads: none
  main_optimizer: transition_model
  pretrained_path: none
  transition_model:
    config:
      action_conditioning: token
      action_dim: 64
      action_tokens: 1
      attn_block_size: 64
      attn_impl: fmha
      camera_extrinsics_dim: 6
      camera_extrinsics_tokens: 0
      decode_state: false
      depth: 10
      embed_dim: 1664
      embodiment_list:
      - franka
      - franka_joints
      - franka_omron
      - franka_omron_state_delta
      - so-101
      - agibot_robotic
      - franka_roboset
      - bridge
      - agilex
      - robomind_franka
      - google
      - kuka
      - franka_robonet
      - baxter
      - sawyer
      - widowx_robonet
      - language_table
      - franka_fmb
      - kuka_robonet
      - agibot_humanoid
      - 1x_robot
      - franka_cart_action_key
      - franka_joint_action_key
      - franka_cart_vel_action_key
      - franka_joint_vel_action_key
      - so-101_joints
      encoder_layernorm: true
      grid_height: 15
      grid_width: 20
      local_attn_window:
      - 8
      - -1
      - -1
      norm_type: rmsnorm
      num_frames: 16
      num_heads: 5
      num_kv_heads: 5
      num_views: 2
      patch_size: 1
      predictor_embed_dim: 640
      qk_norm_type: rmsnorm
      state_dim: 64
      state_tokens: 1
      tubelet_size: 1
      uniform_power: true
      use_activation_checkpointing: false
      use_alibi: false
      use_dt: false
      use_multiembodiment_proj: true
      use_qk_norm: true
      use_rope: true
      use_silu: false
      use_strong_view_conditioning: true
      use_view_tokens: false
      view_groups_v:
      - 1
      - 2
      view_map:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
    optimizer:
      betas:
      - 0.9
      - 0.95
      clip_grad: 1.0
      eps: 1e-8
      final_lr: 5.0e-05
      final_weight_decay: 0.1
      ipe_scale: 1.25
      iterations_per_epoch: 200
      mixed_precision: true
      num_epochs: 5000
      ref_lr: 5.0e-05
      start_lr: 0.0
      use_radamw: false
      warmup: 10
      weight_decay: 0.1
    trainer:
      eval_rollout_steps: 10
      predictor_window_steps: 1
      rollout_steps: 2
      rollout_stop_gradient: true
      train_rollout_prefixes: random
      view_loss_weights: {}
nodes: 4
tasks_per_node: 8
wandb:
  entity: null
  project: robo_jepa
  name: wm-low-compute-cooldown-50m
  'off': false
  run_id: null
