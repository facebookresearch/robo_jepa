app: robo_jepa
data:
  train:
    1X:
      fps: 3
      cameras:
      - front
      raw_fps: 30
      pose_dim: 25
      view_map:
        front: 3
      s3_prefix: 1x-data
      joints_dim: 0
      gripper_dim: 0
      embodiment_name: 1x_robot
    Droid:
      fps: 5
      cameras:
      - .*
      - .*
      raw_fps: 60
      pose_dim: 6
      view_map:
        left: 0
        right: 1
        wrist: 2
      s3_prefix: droid/1.0.1/
      joints_dim: 7
      gripper_dim: 1
      embodiment_name: franka
      use_joint_state: false
      filter_samples_func: app.robo_jepa.datasets.droid.filter_positive_negative_droid
      intermediate_frames_fps: 30
      filter_samples_func_kwargs:
        negative_filter:
          labs:
          - REAL
          buildings:
          - setup room
    kwargs:
      pad_size: 64
      batch_size: 1
      num_workers: 4
      augmentations:
        reprob: 0
        crop_width: 320
        crop_height: 240
        auto_augment: false
        motion_shift: false
        random_resize_scale:
        - 0.5
        - 1
        random_horizontal_flip: false
        random_resize_aspect_ratio:
        - 1.333
        - 1.777
      frames_per_clip: 16
      min_length_to_drop: 11
      read_intermediate_frames: false
    Lerobot:
      fps: 5
      cameras:
      - .*
      - .*
      raw_fps: 30
      pose_dim: 6
      view_map:
        top: 5
        left: 0
        front: 6
        right: 1
        top_1: 5
        top_2: 5
        top_3: 5
        wrist: 2
        front_1: 6
        front_2: 6
        right_1: 1
        right_2: 1
      s3_prefix: lerobot/single_arm_labeled
      joints_dim: 5
      gripper_dim: 1
      embodiment_name: so-101
      intermediate_frames_fps: 30
    OXE_RT1:
