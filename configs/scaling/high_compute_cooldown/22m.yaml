loss:
  loss_exp: 2
  reg_coeff:
  - 0
  cos_loss_weight: 1
  power_loss_weight: 0.01
  no_loss_mask_tokens: false
meta:
  fsdp:
    enabled: false
    cpu_offload: false
    mesh_layout: hsdp
  seed: 234
  dtype: bfloat16
  compile: false
  use_sdpa: true
  eval_freq: 150
  load_checkpoint: true
  save_every_freq: -1
  load_checkpoint_strict: false
  cooldown:
    enabled: true
    num_steps: 5000
  read_checkpoint: <INPUT_CHECKPOINT_PATH>
model:
  heads: none
  main_optimizer: transition_model
  encoder_version: v21
  pretrained_path: none
  transition_model:
    config:
      action_conditioning: token
      action_dim: 64
      action_tokens: 1
      attn_block_size: 64
      attn_impl: fmha
      camera_extrinsics_dim: 6
      camera_extrinsics_tokens: 0
      decode_state: false
      depth: 7
      embed_dim: 1664
      embodiment_list:
      - franka
      - franka_joints
      - franka_omron
      - franka_omron_state_delta
      - so-101
      - agibot_robotic
      - franka_roboset
      - bridge
      - agilex
      - robomind_franka
      - google
      - kuka
      - franka_robonet
      - baxter
      - sawyer
      - widowx_robonet
      - language_table
      - franka_fmb
      - kuka_robonet
      - agibot_humanoid
      - 1x_robot
      - franka_cart_action_key
      - franka_joint_action_key
      - franka_cart_vel_action_key
      - franka_joint_vel_action_key
      - so-101_joints
      encoder_layernorm: true
      grid_height: 15
      grid_width: 20
      local_attn_window:
      - 8
      - -1
      - -1
      norm_type: rmsnorm
      num_frames: 16
      num_heads: 4
      num_kv_heads: 4
      num_views: 2
      patch_size: 1
      predictor_embed_dim: 512
      qk_norm_type: rmsnorm
      state_dim: 64
      state_tokens: 1
      tubelet_size: 1
      uniform_power: true
      use_activation_checkpointing: true
      use_alibi: false
      use_dt: false
      use_multiembodiment_proj: true
      use_qk_norm: true
      use_rope: true
      use_silu: false
      use_strong_view_conditioning: true
      use_view_tokens: false
      view_groups_v:
      - 1
      - 2
      view_map:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
    trainer:
      rollout_steps: 10
      eval_rollout_steps: 10
      rollout_stop_gradient: true
      predictor_window_steps: 1
      train_rollout_prefixes: random
      rollout_fused_backward: true
      rollout_fused_kv_cache: true
    optimizer:
      eps: 1e-8
      betas:
      - 0.9
      - 0.95
      ref_lr: 5.0e-05
      warmup: 10
      final_lr: 5.0e-05
      start_lr: 0
      clip_grad: 1
      ipe_scale: 1.25
      num_epochs: 5000
      use_radamw: false
      weight_decay: 0.1
      mixed_precision: true
      final_weight_decay: 0.1
      iterations_per_epoch: 20
  encoder_pretrained_path: /path/to/vjepa2_1_vitG_384.pt
nodes: 8
wandb:
  entity: null
  project: robo_jepa
  name: wm-high-compute-cooldown-22m
  'off': true
  run_id: null
folder: /path/to/robo_jepa/high_compute_cooldown/22m/
logging:
  write_tag: world_model
cpus_per_task: 16
tasks_per_node: 8
