logging:
  write_tag: world_model
loss:
  loss_exp: 2.0
  cos_loss_weight: 1.0
  power_loss_weight: 0.01
  reg_coeff:
  - 0.0
  no_loss_mask_tokens: false
meta:
  load_checkpoint: false
  read_checkpoint: null
  pretrained: jepa-pretrained.pth.tar
  seed: 234
  eval_freq: 150
  use_sdpa: true
  save_every_freq: 10
  dtype: bfloat16
  compile: true
  load_checkpoint_strict: false
  fsdp:
    enabled: false
    cpu_offload: false
    mesh_layout: hsdp
model:
  transition_model:
    config:
      grid_height: 15
      grid_width: 20
      patch_size: 1
      num_frames: 16
      tubelet_size: 1
      embed_dim: 1664
      predictor_embed_dim: 768
      depth: 14
      num_heads: 6
      num_kv_heads: 6
      uniform_power: true
      num_views: 2
      view_groups_v:
      - 1
      - 2
      use_view_tokens: false
      use_strong_view_conditioning: true
      use_multiembodiment_proj: true
      use_dt: false
      view_map:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      embodiment_list:
      - franka
      - franka_joints
      - franka_omron
      - franka_omron_state_delta
      - so-101
      - agibot_robotic
      - franka_roboset
      - bridge
      - agilex
      - robomind_franka
      - google
      - kuka
      - franka_robonet
      - baxter
      - sawyer
      - widowx_robonet
      - language_table
      - franka_fmb
      - kuka_robonet
      - agibot_humanoid
      - 1x_robot
      - franka_cart_action_key
      - franka_joint_action_key
      - franka_cart_vel_action_key
      - franka_joint_vel_action_key
      - so-101_joints
      action_conditioning: token
      action_tokens: 1
      action_dim: 64
      state_tokens: 1
      state_dim: 64
      camera_extrinsics_tokens: 0
      camera_extrinsics_dim: 6
      decode_state: false
      use_silu: false
      use_activation_checkpointing: false
      local_attn_window:
      - 8
      - -1
      - -1
      attn_block_size: 64
      use_rope: true
      attn_impl: fmha
      use_alibi: false
      encoder_layernorm: true
      norm_type: rmsnorm
      use_qk_norm: true
      qk_norm_type: rmsnorm
    trainer:
      rollout_steps: 2
      predictor_window_steps: 1
      eval_rollout_steps: 10
      train_rollout_prefixes: random
      rollout_stop_gradient: true
      # Optional per-view L1 loss weighting: {int_view_id: float_weight}.
      # Missing IDs default to weight 1.0 (or to view_loss_weights[-1] if set).
      # The special key -1 sets the default weight for any view not explicitly
      # listed. Empty dict = no-op.
      # Canonical convention: 0=left, 1=right, 2=wrist. Examples:
      #   {2: 5.0}            -> wrist 5x, all other views 1x
      #   {-1: 0.5, 2: 5.0}   -> wrist 5x, all other views 0.5x
      # view_loss_weights: {-1: 0.5, 2: 5.0}
      view_loss_weights: {}
    optimizer:
      use_radamw: false
      betas:
      - 0.9
      - 0.95
      eps: 1e-8
      ipe_scale: 1.25
      weight_decay: 0.1
      final_weight_decay: 0.1
      final_lr: 5.0e-5
      start_lr: 0.0
      ref_lr: 5.0e-5
      warmup: 10
      num_epochs: 5000
      iterations_per_epoch: 200
      clip_grad: 1.0
      mixed_precision: true
  heads: none
  main_optimizer: transition_model
  encoder_pretrained_path: /path/to/vjepa2_1_vitG_384.pt
  encoder_version: v21
  pretrained_path: none
