# Conda environment for robo_jepa on the Alliance Fir cluster (exact pins of the tested env). One env for everything:
# training (WM + Cosmos DiT decoder), forward-prediction eval, and planning, including the RoboCasa365 simulator
# (robocasa 1.0.1 + robosuite 1.5.2, mujoco 3.3.1) and the gym_tcp transport (pyzmq, msgpack, lz4).
#
# Use scripts/setup_env.sh, which builds from this file. Doing it by hand:
#   unset PYTHONPATH; export PYTHONNOUSERSITE=1 PIP_CONFIG_FILE=/dev/null  # keep Compute Canada's Python env out
#   conda env create -p $SCRATCH/miniforge3/envs/robo_jepa -f environment.yml
#   conda activate $SCRATCH/miniforge3/envs/robo_jepa
#   pip install --no-deps "git+https://github.com/NVIDIA/Cosmos-Tokenizer.git@3584ae752ce8ebdbe06a420bf60d7513c0e878cc"
#   # RoboCasa one-time setup (run outside any directory containing a `robocasa/` folder; it would shadow the package):
#   python -m robocasa.scripts.setup_macros
#   python -m robosuite.scripts.setup_macros
#   echo y | python -m robocasa.scripts.download_kitchen_assets   # all asset packs, ~23 GB, into site-packages/robocasa
#   export MUJOCO_GL=egl PYOPENGL_PLATFORM=egl                     # headless rendering; also works on CPU nodes (Mesa)
#
# cosmos-tokenizer is left out of this file on purpose: it hard-pins einops==0.7.0, mediapy==1.1.6,
# einx==0.1.3 and ipdb, so it has to go in with --no-deps. Its runtime deps are pinned below.
# decord2 is a drop-in `decord` that bundles ffmpeg + dav1d; it decodes the AV1 LeRobot videos.
# robocasa/robosuite are installed from git at the tested commits (robocasa needs robosuite master). robocasa pins
# numpy==2.2.5, scipy==1.15.3 and (through tianshou==0.4.10) protobuf~=3.19, which caps wandb at 0.25.
# evdev (a pynput dependency) comes from conda-forge: the PyPI sdist doesn't compile against the cluster's kernel headers.
name: robo_jepa
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - packaging
  - evdev=2.0.0
